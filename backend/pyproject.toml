[project]
name = "tilashar-backend"
version = "0.1.0"
description = "Бэкенд приложения Тілашар — изучение казахского языка для детей 6-9 лет"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "sqlalchemy~=2.0.36",
    "alembic~=1.14.0",
    "pydantic~=2.9.0",
    "pydantic-settings~=2.6.0",
    "psycopg[binary]~=3.2.0",
    "pyjwt~=2.9.0",
    "python-multipart~=0.0.12",
    "httpx~=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "pytest-cov~=5.0.0",
    "ruff~=0.7.0",
    "mypy~=1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true

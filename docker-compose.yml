services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tilashar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tilashar}
      POSTGRES_DB: ${POSTGRES_DB:-tilashar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tilashar}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tilashar:tilashar@db:5432/tilashar}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
    ports:
      - "8000:8000"

  web:
    image: nginx:1.27-alpine
    depends_on: [api]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
  media:
